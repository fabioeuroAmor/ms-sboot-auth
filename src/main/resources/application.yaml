spring:
  application:
    name: ms-sboot-auth
  mvc:
    problemdetails:
      enabled: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8081}

jwt:
  expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:15}
  refresh-expiracao-dias: ${JWT_REFRESH_DIAS:7}

app:
  url: ${APP_URL:http://localhost:3001}

# Observabilidade: log estruturado (JSON, formato ECS) + tracing distribuido. O traceId/spanId
# entra automaticamente no MDC (e portanto no log estruturado) e se propaga sozinho entre os
# 4 servicos via header HTTP "traceparent" - nao precisa de codigo manual de correlacao.
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  structured:
    format:
      console: ecs
