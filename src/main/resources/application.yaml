spring:
  application:
    name: ms-sboot-auth
  mvc:
    problemdetails:
      enabled: true
  datasource:
    hikari:
      connectionTimeout: 20000
      maximumPoolSize: 5
    url: jdbc:postgresql://localhost:5432/postgres?stringtype=unspecified
    username: postgres
    password: postgres
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: auth
    ddl-auto: none
    show-sql: false

jwt:
  # Sem valor default: a chave de assinatura JWT NAO pode ter um fallback
  # comitado no repositorio (permitiria forjar tokens validos). A variavel
  # JWT_SECRET precisa ser definida no ambiente (dev, CI e producao).
  secret: ${JWT_SECRET}
  expiracao-minutos: 15
  refresh-expiracao-dias: 7

server:
  port: 8081
